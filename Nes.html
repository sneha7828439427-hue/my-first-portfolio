<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=81;
        if(a>90)
    {
        document.write("O");
    }
    else if(a>80)
    {
         document.write("A+");
    }
    else if(a>70)
    {
         document.write("A");
    }
    else if(a>60)
    {
        document.write("B+");
    }
    else
    {
        document.write("F");
    }
    </script>
</body>
</html>
