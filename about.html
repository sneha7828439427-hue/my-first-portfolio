<!DOCTYPE html>
<html>

<head>
    <title>Moving Car</title>

    <style>

        body {
            margin: 0;
            background-color: skyblue;
            overflow: hidden;
        }

        .road {
            position: relative;
            width: 100%;
            height: 250px;
            margin-top: 250px;
            background-color: #444;
            border-top: 5px solid white;
            border-bottom: 5px solid white;
        }

        .car {
            position: absolute;
            left: 50px;
            bottom: 30px;
            width: 150px;
            height: 60px;
            background-color: red;
            border-radius: 15px 15px 5px 5px;
        }

        .car::before {
            content: "";
            position: absolute;
            width: 80px;
            height: 45px;
            background-color: red;
            top: -30px;
            left: 35px;
            border-radius: 20px 20px 0 0;
        }

        .wheel {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: black;
            border-radius: 50%;
            bottom: -15px;
        }

        .wheel1 {
            left: 20px;
        }

        .wheel2 {
            right: 20px;
        }

        .window1,
        .window2 {
            position: absolute;
            width: 30px;
            height: 20px;
            background-color: lightblue;
            top: -20px;
        }

        .window1 {
            left: 45px;
        }

        .window2 {
            left: 80px;
        }

    </style>
</head>

<body>

    <div class="road">

        <div class="car" id="car">

            <div class="window1"></div>
            <div class="window2"></div>

            <div class="wheel wheel1"></div>
            <div class="wheel wheel2"></div>

        </div>

    </div>


    <script>

        let car = document.getElementById("car");
        let position = 50;

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowRight") {
                position = position + 10;
                car.style.left = position + "px";
            }
            
            if (event.key === "ArrowUp") {
                position = position - 10;
                car.style.left = position - "px";
            }
            if (event.key === "ArrowLeft") {
                position = position - 10;

                if (position < 0) {
                    position = 0;
                }
                 if (event.key === "ArrowLeft") {
                position = position + 10;

                if (position < 0) {
                    position = 0;
                }

                car.style.left = position + "px";
            }

        });

    </script>

</body>

</html>
