<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            border: thin solid black;
            padding: 5px;
            width: 400px;;
            text-align: center;
            border-radius: 10px;
            margin:50px;
        }
        .a{
            font-size: 26px;
            font-weight: bold;
            width: 200px;
            text-align: center;
        
        }
        #t1{
            padding: 5px;
            width: 200px;
            font-size: 26px;
        }
        #b{
            background-color: purple;
            color: blue;
            width: 100px;
            margin: auto;
            padding: 5px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <center> 
    <div class="a"> Enter Mark </div>
    <input type ="text" value="0" id="t1">
    <br>
    <br>
    <input type="Button" value="GET" onclick="get()" id="b">
    <div id="C" > Grade : </div>
    </center>
    <script>
        function get()
        {
            var a = document.getElementById("t1").value;
            if(a>100)
        {
            document.getElementById("C").innerHTML = "Invalid Marks";
        }
        else if(a>95)
        {
            document.getElementById("C").innerHTML = "Grade : O";
        }
        else if(a>90)
        {
             document.getElementById("C").innerHTML = "Grade : A+";
        }
        else if(a>80)
        {
             document.getElementById("C").innerHTML = "Grade : A";
        }
        else if(a>70)
        {
             document.getElementById("C").innerHTML = "Grade : B+";
        }
        else if(a>60)
        {
            document.getElementById("C").innerHTML = "Grade : B";
        }
       else if(a>33)
        {
             document.getElementById("C").innerHTML = "Grade : Pass";
        }
        else
        {
             document.getElementById("C").innerHTML = "Grade : Fail";
        }
        }
    </script>
</body>
</html>
