<!DOCTYPE html>
<html>

<head>

    <title>Moving Car</title>

    <style>

        #car {
            position: absolute;
            left: 0px;
            top: 150px;
            font-size: 50px;
        }

    </style>

</head>

<body onkeydown="moveCar(event)">

<h2>Press Right Arrow Key to Move the Car</h2>

<div id="car">🚗</div>

<script>

let position = 0;

function moveCar(event) {

    if (event.key == "ArrowRight") {

        position = position + 10;

        document.getElementById("car").style.left =
        position + "px";

    }

}

</script>

</body>
</html>
