<!DOCTYPE html>
<html>
<head>
    <title>Hover Example</title>

    <style>
        .text {
            color: blue;
            font-size: 20px;
        }

        .text:hover {
            color: red;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <p class="text">Hello Sneha</p>

</body>
</html>
