<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            background-color: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        table {
            background-color: #222;
            padding: 20px;
            border-radius: 15px;
            border: none;
        }

        td {
            padding: 7px;
            border: none;
        }

        #t1 {
            width: 100%;
            height: 60px;
            background-color: black;
            color: lime;
            border: none;
            border-radius: 7px;
            font-size: 30px;
            text-align: right;
            box-sizing: border-box;
            padding-right: 15px;
        }

        input[type="button"] {
            width: 94px;
            height: 94px;
            border: none;
            border-radius: 8px;
            background-color: #444;
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #555;
        }

        .operator {
            background-color: orange !important;
        }

        .equal {
            background-color: #20a844 !important;
        }

        .clear {
            background-color: #444 !important;
        }
    </style>
</head>

<body>

    <table>

        <!-- Display -->
        <tr>
            <td colspan="4">
                <input type="text" value="0" id="t1" readonly>
            </td>
        </tr>

        <!-- C, Backspace, %, Divide -->
        <tr>
            <td>
                <input type="button" value="C" onclick="clr()" class="clear">
            </td>

            <td>
                <input type="button" value="⌫" onclick="del()">
            </td>

            <td>
                <input type="button" value="%" onclick="percent()">
            </td>

            <td>
                <input type="button" value="÷" onclick="op('/')" class="operator">
            </td>
        </tr>

        <!-- 7 8 9 Multiply -->
        <tr>
            <td>
                <input type="button" value="7" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="8" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="9" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="×" onclick="op('x')" class="operator">
            </td>
        </tr>

        <!-- 4 5 6 Minus -->
        <tr>
            <td>
                <input type="button" value="4" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="5" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="6" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="−" onclick="op('-')" class="operator">
            </td>
        </tr>

        <!-- 1 2 3 Plus -->
        <tr>
            <td>
                <input type="button" value="1" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="2" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="3" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="+" onclick="op('+')" class="operator">
            </td>
        </tr>

        <!-- 0, Decimal, Equal -->
        <tr>
            <td>
                <input type="button" value="0" onclick="abc(this.value)">
            </td>

            <td>
                <input type="button" value="." onclick="abc(this.value)">
            </td>

            <td colspan="2">
                <input type="button" value="=" onclick="res()" class="equal"
                    style="width: 194px;">
            </td>
        </tr>

    </table>


    <script>

        var a1 = "";
        var fv = 0;
        var sv = 0;
        var oop = "";


        // Number aur decimal display karne ke liye
        function abc(h)
        {
            a1 = document.getElementById("t1").value;

            // Starting mein 0 ko remove karna
            if (a1 == "0")
            {
                a1 = "";
            }

            document.getElementById("t1").value = a1 + h;
        }


        // Operator (+, -, x, /)
        function op(z)
        {
            fv = document.getElementById("t1").value;

            document.getElementById("t1").value = "";

            oop = z;
        }


        // Result
        function res()
        {
            sv = document.getElementById("t1").value;

            var x;


            // Addition
            if (oop == "+")
            {
                x = parseFloat(fv) + parseFloat(sv);
            }


            // Multiplication
            if (oop == "x")
            {
                x = parseFloat(fv) * parseFloat(sv);
            }


            // Subtraction
            if (oop == "-")
            {
                x = parseFloat(fv) - parseFloat(sv);
            }


            // Division
            if (oop == "/")
            {
                x = parseFloat(fv) / parseFloat(sv);
            }


            document.getElementById("t1").value = x;
        }


        // Clear button
        function clr()
        {
            document.getElementById("t1").value = "0";

            fv = 0;
            sv = 0;
            oop = "";
            a1 = "";
        }


        // Backspace button
        function del()
        {
            var v = document.getElementById("t1").value;

            v = v.slice(0, -1);

            if (v == "")
            {
                v = "0";
            }

            document.getElementById("t1").value = v;
        }


        // Percentage button
        function percent()
        {
            var v = document.getElementById("t1").value;

            document.getElementById("t1").value =
                parseFloat(v) / 100;
        }

    </script>

</body>

</html>
